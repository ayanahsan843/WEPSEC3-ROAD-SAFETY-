<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Road Safety Database</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen font-sans">

    <nav class="bg-gray-800 border-b border-gray-700 px-6 py-4 flex justify-between items-center shadow-lg">
        <div class="flex items-center space-x-3">
            <div class="bg-blue-600 p-2 rounded-lg text-white font-bold text-xl">RS</div>
            <h1 class="text-xl font-bold tracking-wide">ROAD SAFETY DATABASE</h1>
        </div>
        <div class="flex items-center space-x-4">
            <span id="role-badge" class="text-xs px-3 py-1 rounded-full font-medium bg-gray-700 text-gray-300">Guest Viewer</span>
            <button id="auth-btn" onclick="toggleAuth()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-semibold transition-all shadow-md">
                Admin Login
            </button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-4 lg:p-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <section id="upload-section" class="hidden lg:col-span-1 space-y-6">
            <div class="bg-gray-800 border border-gray-700 rounded-xl p-6 shadow-xl">
                <h2 class="text-lg font-bold mb-4 text-blue-400 flex items-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    Add New Record
                </h2>
                
                <form id="doc-form" onsubmit="handleFormSubmit(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Subject / Details</label>
                        <input type="text" id="doc-subject" required placeholder="Driver or vehicle details" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-blue-500 transition">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Approval Date</label>
                            <input type="date" id="doc-approval" required class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-blue-500 transition">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Expiry Date</label>
                            <input type="date" id="doc-expiry" required class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-blue-500 transition">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Performance Score</label>
                            <input type="number" id="doc-score" min="0" max="100" placeholder="e.g. 95" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-blue-500 transition">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Initial Status</label>
                            <select id="doc-status" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-blue-500 transition">
                                <option value="Active">Active</option>
                                <option value="Pending">Pending</option>
                                <option value="Rejected">Rejected</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Attach Files / Docs</label>
                        <div id="drop-zone" class="border-2 border-dashed border-gray-700 hover:border-blue-500/50 rounded-lg p-4 text-center cursor-pointer transition bg-gray-900/50">
                            <input type="file" id="file-input" multiple class="hidden">
                            <p class="text-xs text-gray-400" id="drop-zone-text">Click to choose or drop files here</p>
                            <div id="selected-files-preview" class="mt-2 text-left space-y-1 text-gray-400 max-h-24 overflow-y-auto text-xs"></div>
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 px-4 rounded-lg transition shadow-md">
                        Save to Cloud Hub
                    </button>
                </form>
            </div>
        </section>

        <section id="dashboard-section" class="col-span-1 lg:col-span-3 space-y-4">
            <div class="bg-gray-800 border border-gray-700 rounded-xl shadow-xl overflow-hidden">
                
                <div class="p-6 border-b border-gray-700 bg-gray-800/50 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                    <div>
                        <h2 class="text-lg font-bold tracking-wide">Live Log Registry</h2>
                        <p class="text-xs text-gray-400">Automated safety data synchronization.</p>
                    </div>
                    <div class="w-full sm:w-auto">
                        <input type="text" id="search-bar" oninput="filterTable()" placeholder="Search registry..." class="w-full sm:w-64 bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-blue-500 transition">
                    </div>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-900/60 text-xs font-semibold uppercase tracking-wider text-gray-400 border-b border-gray-700">
                                <th class="py-4 px-6">RFI Reference</th>
                                <th class="py-4 px-6">Subject / Profile</th>
                                <th class="py-4 px-6">Status</th>
                                <th class="py-4 px-6">Approval Date</th>
                                <th class="py-4 px-6">Expiry Date</th>
                                <th class="py-4 px-6">Score</th>
                                <th class="py-4 px-6 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="document-rows" class="divide-y divide-gray-700 text-sm">
                            <tr>
                                <td colspan="7" class="text-center py-8 text-gray-500">Connecting live to Supabase cloud repository...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </section>
    </main>

    <script>
        // --- LIVE BACKEND LINK CONFIGURATION ---
        const SUPABASE_URL = "https://fhnzoxfuqjpsqfpvmhja.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_7rFD382AoegyCf0VpKtvpQ_Sck9o0b686b245786ba1134789505d989d3cf55655bd";
        
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let isAdmin = false;
        let selectedFiles = [];
        let allDocuments = [];

        document.addEventListener('DOMContentLoaded', () => {
            setupDragAndDrop();
            fetchDocuments();
        });

        function setupDragAndDrop() {
            const dropZone = document.getElementById('drop-zone');
            const fileInput = document.getElementById('file-input');
            dropZone.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', (e) => handleFileSelection(e.target.files));
            ['dragenter', 'dragover'].forEach(name => {
                dropZone.addEventListener(name, (e) => { e.preventDefault(); dropZone.classList.add('bg-blue-950/30'); }, false);
            });
            ['dragleave', 'drop'].forEach(name => {
                dropZone.addEventListener(name, (e) => { e.preventDefault(); dropZone.classList.remove('bg-blue-950/30'); }, false);
            });
            dropZone.addEventListener('drop', (e) => handleFileSelection(e.dataTransfer.files));
        }

        function handleFileSelection(files) {
            selectedFiles = Array.from(files);
            const preview = document.getElementById('selected-files-preview');
            const text = document.getElementById('drop-zone-text');
            if(selectedFiles.length > 0) {
                text.innerHTML = `Selected <span class="text-blue-400 font-bold">${selectedFiles.length}</span> file(s)`;
                preview.innerHTML = selectedFiles.map(f => `• ${f.name}`).join('<br>');
            } else {
                text.innerText = "Click to choose or drop files here";
                preview.innerHTML = "";
            }
        }

        function toggleAuth() {
            if (!isAdmin) {
                const password = prompt("Enter Admin Security Credentials to unlock file ingest features:");
                if (password === "1234") { // <--- Put your chosen admin password here
                    isAdmin = true;
                    document.getElementById('auth-btn').innerText = "Admin Logout";
                    document.getElementById('auth-btn').classList.replace('bg-blue-600', 'bg-red-600');
                    document.getElementById('role-badge').innerText = "Administrator Mode";
                    document.getElementById('role-badge').classList.replace('bg-gray-700', 'bg-emerald-500/20');
                    document.getElementById('role-badge').classList.add('text-emerald-400');
                    document.getElementById('upload-section').classList.remove('hidden');
                    document.getElementById('dashboard-section').classList.replace('lg:col-span-3', 'lg:col-span-2');
                } else if (password !== null) {
                    alert("Invalid credentials.");
                }
            } else {
                isAdmin = false;
                document.getElementById('auth-btn').innerText = "Admin Login";
                document.getElementById('auth-btn').classList.replace('bg-red-600', 'bg-blue-600');
                document.getElementById('role-badge').innerText = "Guest Viewer";
                document.getElementById('role-badge').classList.replace('bg-emerald-500/20', 'bg-gray-700');
                document.getElementById('role-badge').classList.remove('text-emerald-400');
                document.getElementById('upload-section').classList.add('hidden');
                document.getElementById('dashboard-section').classList.replace('lg:col-span-2', 'lg:col-span-3');
            }
        }

        async function fetchDocuments() {
            // Fetch directly from your Supabase table
            let { data: items, error } = await supabase
                .from('documents') // Make sure your table name in Supabase is spelled exactly 'documents'
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error("Database sync error:", error);
                document.getElementById('document-rows').innerHTML = `<tr><td colspan="7" class="text-center py-8 text-red-400">Error reading table. Verify your Supabase table name is 'documents'.</td></tr>`;
                return;
            }

            allDocuments = items || [];
            renderTable(allDocuments);
        }

        function renderTable(data) {
            const container = document.getElementById('document-rows');
            if (data.length === 0) {
                container.innerHTML = `<tr><td colspan="7" class="text-center py-8 text-gray-500">No logs stored in the cloud.</td></tr>`;
                return;
            }

            container.innerHTML = data.map((doc, index) => {
                const trackingId = doc.rfi_id || `RFI-${String(data.length - index).padStart(4, '0')}`;
                const fileCount = doc.files ? doc.files.length : 0;
                
                // Determine color formatting based on real-time log status
                let statusColor = "bg-emerald-500/10 text-emerald-400 border-emerald-500/20";
                if(doc.status === "Pending") statusColor = "bg-amber-500/10 text-amber-400 border-amber-500/20";
                if(doc.status === "Rejected") statusColor = "bg-red-500/10 text-red-400 border-red-500/20";

                return `
                    <tr class="hover:bg-gray-800/40 transition">
                        <td class="py-4 px-6 font-mono font-bold text-blue-400">${trackingId}</td>
                        <td class="py-4 px-6 font-semibold text-gray-200">${doc.subject}</td>
                        <td class="py-4 px-6">
                            <span class="px-2.5 py-1 border rounded text-xs font-medium ${statusColor}">${doc.status || 'Active'}</span>
                        </td>
                        <td class="py-4 px-6 text-gray-400">${doc.approval_date || '-'}</td>
                        <td class="py-4 px-6 text-gray-400">${doc.expiry_date || '-'}</td>
                        <td class="py-4 px-6 font-bold text-blue-300">${doc.score ? doc.score + '%' : '-'}</td>
                        <td class="py-4 px-6 text-right">
                            <button onclick="downloadPayload('${doc.id}')" class="bg-gray-700 hover:bg-blue-600 text-white font-medium px-2.5 py-1.5 rounded text-xs transition inline-flex items-center">
                                Save Documents (${fileCount})
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function filterTable() {
            const q = document.getElementById('search-bar').value.toLowerCase();
            const filtered = allDocuments.filter(d => 
                d.subject.toLowerCase().includes(q) || 
                (d.status && d.status.toLowerCase().includes(q))
            );
            renderTable(filtered);
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            if(!isAdmin) return alert("Please log in as an administrator first.");

            const subject = document.getElementById('doc-subject').value;
            const approval_date = document.getElementById('doc-approval').value;
            const expiry_date = document.getElementById('doc-expiry').value;
            const score = document.getElementById('doc-score').value;
            const status = document.getElementById('doc-status').value;

            const processedFiles = await Promise.all(selectedFiles.map(async (file) => {
                const base64Data = await convertFileToBase64(file);
                return { name: file.name, type: file.type, data: base64Data };
            }));

            // Save record directly into Supabase
            const { error } = await supabase
                .from('documents')
                .insert([{ 
                    subject: subject, 
                    approval_date: approval_date, 
                    expiry_date: expiry_date, 
                    score: score, 
                    status: status,
                    files: processedFiles 
                }]);

            if(error) {
                alert("Database insertion error: " + error.message);
            } else {
                document.getElementById('doc-form').reset();
                selectedFiles = [];
                handleFileSelection([]);
                fetchDocuments();
            }
        }

        function convertFileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = err => reject(err);
            });
        }

        async function downloadPayload(id) {
            const doc = allDocuments.find(d => d.id == id);
            if(!doc || !doc.files || doc.files.length === 0) return alert("No attached files to download.");

            const zip = new JSZip();
            doc.files.forEach(f => zip.file(f.name, f.data, { base64: true }));
            const blob = await zip.generateAsync({ type: "blob" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `${doc.subject.replace(/[^a-z0-9]/gi, '_')}_files.zip`;
            link.click();
        }
    </script>
</body>
</html>
