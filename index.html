<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Road Safety Database</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen font-sans">

    <nav class="bg-gray-800 border-b border-gray-700 px-6 py-4 flex justify-between items-center shadow-lg">
        <div class="flex items-center space-x-3">
            <div class="bg-blue-600 p-2 rounded-lg text-white font-bold text-xl">RS</div>
            <h1 class="text-xl font-bold tracking-wide">ROAD SAFETY DATABASE</h1>
        </div>
        
        <div class="flex items-center space-x-3">
            <span id="role-badge" class="text-xs px-3 py-1 rounded-full font-medium bg-gray-700 text-gray-300">Guest Viewer</span>
            
            <div id="login-container" class="flex items-center space-x-2">
                <input type="text" id="admin-pass-input" placeholder="Enter 1234" class="bg-gray-900 border border-gray-700 rounded-lg px-3 py-1 text-sm text-white w-28 focus:outline-none focus:border-blue-500">
                <button type="button" onclick="loginAdmin()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-1 rounded-lg text-sm font-semibold transition-all shadow-md">
                    Login
                </button>
            </div>

            <button id="logout-btn" onclick="logoutAdmin()" class="hidden bg-red-600 hover:bg-red-500 text-white px-4 py-1 rounded-lg text-sm font-semibold transition-all shadow-md">
                Logout
            </button>
        </div>
    </nav>

    <div id="error-display" class="hidden max-w-7xl mx-auto mt-4 mx-4 p-4 bg-red-900/40 border border-red-700 rounded-xl text-red-200 text-sm font-mono"></div>

    <main class="max-w-7xl mx-auto p-4 lg:p-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <section id="upload-section" class="hidden lg:col-span-1 space-y-6">
            <div class="bg-gray-800 border border-gray-700 rounded-xl p-6 shadow-xl">
                <h2 class="text-lg font-bold mb-4 text-blue-400 flex items-center">
                    Add New Record
                </h2>
                
                <form id="doc-form" onsubmit="handleFormSubmit(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Subject / Details</label>
                        <input type="text" id="doc-subject" required placeholder="Driver or vehicle details" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-blue-500">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Approval Date</label>
                            <input type="date" id="doc-approval" required class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Expiry Date</label>
                            <input type="date" id="doc-expiry" required class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-blue-500">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Performance Score</label>
                            <input type="number" id="doc-score" min="0" max="100" placeholder="e.g. 95" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Initial Status</label>
                            <select id="doc-status" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-blue-500">
                                <option value="Active">Active</option>
                                <option value="Pending">Pending</option>
                                <option value="Rejected">Rejected</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Attach Files / Docs</label>
                        <div id="drop-zone" class="border-2 border-dashed border-gray-700 hover:border-blue-500/50 rounded-lg p-4 text-center cursor-pointer bg-gray-900/50">
                            <input type="file" id="file-input" multiple class="hidden">
                            <p class="text-xs text-gray-400" id="drop-zone-text">Click to choose or drop files here</p>
                            <div id="selected-files-preview" class="mt-2 text-left space-y-1 text-gray-400 max-h-24 overflow-y-auto text-xs"></div>
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 px-4 rounded-lg transition shadow-md">
                        Save to Cloud Hub
                    </button>
                </form>
            </div>
        </section>

        <section id="dashboard-section" class="col-span-1 lg:col-span-3 space-y-4">
            <div class="bg-gray-800 border border-gray-700 rounded-xl shadow-xl overflow-hidden">
                
                <div class="p-6 border-b border-gray-700 bg-gray-800/50 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                    <div>
                        <h2 class="text-lg font-bold tracking-wide">Live Log Registry</h2>
                        <p class="text-xs text-gray-400">Automated safety data synchronization.</p>
                    </div>
                    <div class="w-full sm:w-auto">
                        <input type="text" id="search-bar" oninput="filterTable()" placeholder="Search registry..." class="w-full sm:w-64 bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-blue-500">
                    </div>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-900/60 text-xs font-semibold uppercase tracking-wider text-gray-400 border-b border-gray-700">
                                <th class="py-4 px-6">RFI Reference</th>
                                <th class="py-4 px-6">Subject / Profile</th>
                                <th class="py-4 px-6">Status</th>
                                <th class="py-4 px-6">Approval Date</th>
                                <th class="py-4 px-6">Expiry Date</th>
                                <th class="py-4 px-6">Score</th>
                                <th class="py-4 px-6 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="document-rows" class="divide-y divide-gray-700 text-sm">
                            <tr>
                                <td colspan="7" class="text-center py-8 text-gray-500">Connecting live to Supabase cloud repository...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </section>
    </main>

    <script>
        // --- ROUTING LINK INTEGRATION ---
        const SUPABASE_URL = "https://fhnzoxfuqjpsqfpvmhja.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZobnpveGZ1cWpwc3FmcHZtaGphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDc0MzE0MTMsImV4cCI6MjA2MzAwNzQxM30.7M9R9Kclp2j7w6pL_S8rV-9bZ0hO5T5Ue7A9E5H7g9I";
        
        let supabaseClient;
        let isAdmin = false;
        let selectedFiles = [];
        let allDocuments = [];

        // Safely Initialize Supabase Client
        try {
            if (typeof supabase !== 'undefined' && supabase.createClient) {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            } else {
                showError("Error: Supabase library failed to load properly from CDN network.");
            }
        } catch (initErr) {
            showError("Initialization error: " + initErr.message);
        }

        document.addEventListener('DOMContentLoaded', () => {
            setupDragAndDrop();
            fetchDocuments();
        });

        function showError(msg) {
            const errDiv = document.getElementById('error-display');
            if (errDiv) {
                errDiv.innerText = msg;
                errDiv.classList.remove('hidden');
            }
        }

        function setupDragAndDrop() {
            const dropZone = document.getElementById('drop-zone');
            const fileInput = document.getElementById('file-input');
            if(!dropZone || !fileInput) return;
            
            dropZone.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', (e) => handleFileSelection(e.target.files));
        }

        function handleFileSelection(files) {
            selectedFiles = Array.from(files);
            const preview = document.getElementById('selected-files-preview');
            const text = document.getElementById('drop-zone-text');
            if(!preview || !text) return;

            if(selectedFiles.length > 0) {
                text.innerHTML = `Selected <span class="text-blue-400 font-bold">${selectedFiles.length}</span> file(s)`;
                preview.innerHTML = selectedFiles.map(f => `• ${f.name}`).join('<br>');
            } else {
                text.innerText = "Click to choose or drop files here";
                preview.innerHTML = "";
            }
        }

        function loginAdmin() {
            try {
                const passInput = document.getElementById('admin-pass-input');
                if(!passInput) return;

                const enteredPass = passInput.value;
                
                if (enteredPass === "1234") { 
                    isAdmin = true;
                    
                    document.getElementById('role-badge').innerText = "Administrator Mode";
                    document.getElementById('role-badge').className = "text-xs px-3 py-1 rounded-full font-medium bg-emerald-500/20 text-emerald-400";
                    
                    document.getElementById('login-container').classList.add('hidden');
                    document.getElementById('logout-btn').classList.remove('hidden');
                    
                    document.getElementById('upload-section').classList.remove('hidden');
                    document.getElementById('dashboard-section').className = "col-span-1 lg:col-span-2 space-y-4";
                    
                    passInput.value = "";
                } else {
                    alert("Invalid password.");
                }
            } catch(err) {
                showError("Login Action Error: " + err.message);
            }
        }

        function logoutAdmin() {
            isAdmin = false;
            document.getElementById('role-badge').innerText = "Guest Viewer";
            document.getElementById('role-badge').className = "text-xs px-3 py-1 rounded-full font-medium bg-gray-700 text-gray-300";
            
            document.getElementById('login-container').classList.remove('hidden');
            document.getElementById('logout-btn').classList.add('hidden');
            
            document.getElementById('upload-section').classList.add('hidden');
            document.getElementById('dashboard-section').className = "col-span-1 lg:col-span-3 space-y-4";
        }

        async function fetchDocuments() {
            if (!supabaseClient) return;
            try {
                let { data: items, error } = await supabaseClient
                    .from('safety_logs') 
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                // Clear prior error display if loading succeeds
                const errDiv = document.getElementById('error-display');
                if(errDiv) errDiv.classList.add('hidden');

                allDocuments = items || [];
                renderTable(allDocuments);
            } catch (err) {
                console.error("Database connection fault:", err);
                showError("Database Connection Fault: " + err.message + " | Please ensure your table has columns for subject, status, approval_date, expiry_date, score, and files.");
            }
        }

        function renderTable(data) {
            const container = document.getElementById('document-rows');
            if (!container) return;
            if (data.length === 0) {
                container.innerHTML = `<tr><td colspan="7" class="text-center py-8 text-gray-500">No logs stored in the cloud repository.</td></tr>`;
                return;
            }

            container.innerHTML = data.map((doc, index) => {
                const trackingId = doc.rfi_id || `RFI-${String(data.length - index).padStart(4, '0')}`;
                const fileCount = doc.files ? doc.files.length : 0;
                
                let statusColor = "bg-emerald-500/10 text-emerald-400 border-emerald-500/20";
                if(doc.status === "Pending") statusColor = "bg-amber-500/10 text-amber-400 border-amber-500/20";
                if(doc.status === "Rejected") statusColor = "bg-red-500/10 text-red-400 border-red-500/20";

                return `
                    <tr class="hover:bg-gray-800/40 transition">
                        <td class="py-4 px-6 font-mono font-bold text-blue-400">${trackingId}</td>
                        <td class="py-4 px-6 font-semibold text-gray-200">${doc.subject}</td>
                        <td class="py-4 px-6">
                            <span class="px-2.5 py-1 border rounded text-xs font-medium ${statusColor}">${doc.status || 'Active'}</span>
                        </td>
                        <td class="py-4 px-6 text-gray-400">${doc.approval_date || '-'}</td>
                        <td class="py-4 px-6 text-gray-400">${doc.expiry_date || '-'}</td>
                        <td class="py-4 px-6 font-bold text-blue-300">${doc.score ? doc.score + '%' : '-'}</td>
                        <td class="py-4 px-6 text-right">
                            <button onclick="downloadPayload('${doc.id}')" class="bg-gray-700 hover:bg-blue-600 text-white font-medium px-2.5 py-1.5 rounded text-xs transition inline-flex items-center">
                                Save Documents (${fileCount})
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function filterTable() {
            const q = document.getElementById('search-bar').value.toLowerCase();
            const filtered = allDocuments.filter(d => 
                d.subject.toLowerCase().includes(q) || 
                (d.status && d.status.toLowerCase().includes(q))
            );
            renderTable(filtered);
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            if(!isAdmin || !supabaseClient) return;

            try {
                const subject = document.getElementById('doc-subject').value;
                const approval_date = document.getElementById('doc-approval').value;
                const expiry_date = document.getElementById('doc-expiry').value;
                const score = document.getElementById('doc-score').value;
                const status = document.getElementById('doc-status').value;

                const processedFiles = await Promise.all(selectedFiles.map(async (file) => {
                    const base64Data = await convertFileToBase64(file);
                    return { name: file.name, type: file.type, data: base64Data };
                }));

                const { error } = await supabaseClient
                    .from('safety_logs')
                    .insert([{ 
                        subject: subject, 
                        approval_date: approval_date, 
                        expiry_date: expiry_date, 
                        score: score, 
                        status: status,
                        files: processedFiles 
                    }]);

                if(error) throw error;

                document.getElementById('doc-form').reset();
                selectedFiles = [];
                handleFileSelection([]);
                fetchDocuments();
            } catch(submitErr) {
                alert("Upload failed: " + submitErr.message);
            }
        }

        function convertFileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = err => reject(err);
            });
        }

        async function downloadPayload(id) {
            const doc = allDocuments.find(d => d.id == id);
            if(!doc || !doc.files || doc.files.length === 0) return alert("No attached files found.");

            try {
                const zip = new JSZip();
                doc.files.forEach(f => zip.file(f.name, f.data, { base64: true }));
                const blob = await zip.generateAsync({ type: "blob" });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = `${doc.subject.replace(/[^a-z0-9]/gi, '_')}_files.zip`;
                link.click();
            } catch (zipErr) {
                alert("Extraction failed: " + zipErr.message);
            }
        }
    </script>
</body>
</html>
